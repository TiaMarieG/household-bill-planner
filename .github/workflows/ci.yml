name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bill_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U planner -d bill_planner"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://planner:ci-only-password@localhost:5432/bill_planner
      TEST_DATABASE_URL: postgresql+psycopg://planner:ci-only-password@localhost:5432/bill_planner_test
      REQUIRE_TEST_DATABASE: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Create test database
        run: >-
          python -c "import psycopg;
          conn = psycopg.connect('postgresql://planner:ci-only-password@localhost:5432/bill_planner', autocommit=True);
          conn.execute('CREATE DATABASE bill_planner_test')"

      - name: Migrations apply and match the models
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
