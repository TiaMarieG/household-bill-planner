<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Household Bill Planner</title>
    <script>
      (function applySavedThemeBeforeFirstPaint() {
        var choice = "system";
        try {
          choice = localStorage.getItem("bill-planner-theme") || "system";
        } catch (error) {}
        var dark = choice === "dark" ||
          (choice !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
